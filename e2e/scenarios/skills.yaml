scenarios:
  # ── Skills Tab Navigation ──────────────────────────────────────

  - name: "Switch to Skills tab"
    tags: [ui, skills]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: verify
        expected:
          element_exists: ".skills-panel"

  - name: "Default skill is listed"
    tags: [ui, skills]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: verify
        expected:
          element_exists: ".skills-panel__item"

  # ── Skill Ordering ──────────────────────────────────────────────

  - name: "Built-in skills appear first in the list"
    tags: [ui, skills, ordering]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # The first skill in the list should be a built-in skill
      # Built-in skills have no delete button
      - action: verify
        expected:
          element_not_exists: ".skills-panel__item:first-child .skills-panel__delete-btn"

  # ── Skill Detail Modal ─────────────────────────────────────────

  - name: "Open skill detail modal"
    tags: [ui, skills, modal]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__item"

      - action: verify
        expected:
          element_exists: ".skill-detail-modal"

      - action: verify
        expected:
          element_exists: ".skill-detail-modal__name"

      - action: verify
        expected:
          element_exists: ".skill-detail-modal__desc"

  - name: "Skill detail modal shows markdown preview by default"
    tags: [ui, skills, modal]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__item"

      - action: verify
        expected:
          element_exists: ".skill-detail-modal__tab--active"

      - action: verify
        expected:
          element_exists: ".skill-detail-modal__content--preview"

  - name: "Switch to Source tab in skill detail modal"
    tags: [ui, skills, modal]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__item"

      # Click the Source tab (second tab button)
      - action: click
        selector: ".skill-detail-modal__tab:nth-child(2)"

      - action: verify
        expected:
          element_exists: "pre.skill-detail-modal__content"

      - action: verify
        expected:
          element_not_exists: ".skill-detail-modal__content--preview"

  - name: "Close skill detail modal by clicking overlay"
    tags: [ui, skills, modal]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__item"

      - action: verify
        expected:
          element_exists: ".skill-detail-overlay"

      - action: click
        selector: ".skill-detail-overlay"

      - action: verify
        expected:
          element_not_exists: ".skill-detail-overlay"

  - name: "Close skill detail modal by clicking close button"
    tags: [ui, skills, modal]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__item"

      - action: click
        selector: ".skill-detail-modal__close"

      - action: verify
        expected:
          element_not_exists: ".skill-detail-overlay"

  # ── Create Skill Dialog ────────────────────────────────────────

  - name: "Open create skill dialog"
    tags: [ui, skills, create]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__create-btn"

      - action: verify
        expected:
          element_exists: ".create-skill-dialog"

      - action: verify
        expected:
          element_exists: ".create-skill-dialog__input"

      - action: verify
        expected:
          element_exists: ".create-skill-dialog__textarea"

  - name: "Close create skill dialog with cancel"
    tags: [ui, skills, create]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__create-btn"

      - action: verify
        expected:
          element_exists: ".create-skill-overlay"

      - action: click
        selector: ".create-skill-dialog__cancel"

      - action: verify
        expected:
          element_not_exists: ".create-skill-overlay"

  - name: "Create a custom skill successfully"
    tags: [ui, skills, create]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__create-btn"

      - action: type
        selector: ".create-skill-dialog__input:nth-of-type(1)"
        value: "test-skill"

      - action: type
        selector: ".create-skill-dialog__input:nth-of-type(2)"
        value: "A test skill for E2E testing"

      - action: type
        selector: ".create-skill-dialog__textarea"
        value: "Say hello to the user."

      - action: click
        selector: ".create-skill-dialog__save"

      # Dialog closes on success
      - action: verify
        expected:
          element_not_exists: ".create-skill-overlay"

      # New skill appears in the list
      - action: verify
        expected:
          text_contains: "test-skill"

  # ── Delete Skill ─────────────────────────────────────────────

  - name: "Built-in skill has no delete button"
    tags: [ui, skills, delete]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # The first skill is built-in (analyze-data); it should have
      # no delete button
      - action: verify
        expected:
          element_not_exists: ".skills-panel__item:first-child .skills-panel__delete-btn"

  - name: "Delete a custom skill"
    tags: [ui, skills, delete]
    depends_on: "Create a custom skill successfully"
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # The custom skill (last in list) should have a delete button
      - action: verify
        expected:
          element_exists: ".skills-panel__item:last-child .skills-panel__delete-btn"

      - action: click
        selector: ".skills-panel__item:last-child .skills-panel__delete-btn"

      # Accept the confirmation dialog
      - action: confirm_dialog
        accept: true

      # Skill removed from the list
      - action: verify
        expected:
          text_not_contains: "test-skill"

  # ── Enable / Disable Skill ──────────────────────────────────

  - name: "Disable a skill hides its Use button"
    tags: [ui, skills, toggle]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # Click the toggle (eye) button on the first skill
      - action: click
        selector: ".skills-panel__item:first-child .skills-panel__toggle-btn"

      # The skill item gets the disabled class
      - action: verify
        expected:
          element_exists: ".skills-panel__item--disabled"

      # Use button is hidden for disabled skills
      - action: verify
        expected:
          element_not_exists: ".skills-panel__item--disabled .skills-panel__use-btn"

  - name: "Re-enable a disabled skill restores Use button"
    tags: [ui, skills, toggle]
    depends_on: "Disable a skill hides its Use button"
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # Click the toggle button again to re-enable
      - action: click
        selector: ".skills-panel__item:first-child .skills-panel__toggle-btn"

      # Disabled class removed
      - action: verify
        expected:
          element_not_exists: ".skills-panel__item--disabled"

      # Use button is visible again
      - action: verify
        expected:
          element_exists: ".skills-panel__item:first-child .skills-panel__use-btn"

  - name: "Disabled skill is hidden from slash command menu"
    tags: [ui, skills, toggle, slash]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # Disable the first skill
      - action: click
        selector: ".skills-panel__item:first-child .skills-panel__toggle-btn"

      - action: verify
        expected:
          element_exists: ".skills-panel__item--disabled"

      # Type / in chat input to open slash menu
      - action: type
        selector: ".chat-input__textarea"
        value: "/"

      # Slash menu should not contain the disabled skill
      - action: verify
        expected:
          element_not_exists: ".slash-menu__item"

      # Clean up: re-enable the skill
      - action: clear
        selector: ".chat-input__textarea"

      - action: click
        selector: ".skills-panel__item:first-child .skills-panel__toggle-btn"

  # ── Slash Command Menu ───────────────────────────────────────

  - name: "Typing / opens slash command menu"
    tags: [ui, skills, slash]
    steps:
      - action: type
        selector: ".chat-input__textarea"
        value: "/"

      - action: verify
        expected:
          element_exists: ".slash-menu"

  - name: "Slash menu filters skills by name"
    tags: [ui, skills, slash]
    steps:
      - action: type
        selector: ".chat-input__textarea"
        value: "/analyze"

      - action: verify
        expected:
          element_exists: ".slash-menu"

      - action: verify
        expected:
          text_contains: "analyze-data"

  - name: "Dismiss slash menu with Escape"
    tags: [ui, skills, slash]
    steps:
      - action: type
        selector: ".chat-input__textarea"
        value: "/"

      - action: verify
        expected:
          element_exists: ".slash-menu"

      - action: key
        key: "Escape"

      - action: verify
        expected:
          element_not_exists: ".slash-menu"

  - name: "Select skill from slash menu inserts command"
    tags: [ui, skills, slash]
    steps:
      - action: type
        selector: ".chat-input__textarea"
        value: "/"

      - action: verify
        expected:
          element_exists: ".slash-menu"

      # Press Enter to select the first (highlighted) item
      - action: key
        key: "Enter"

      - action: verify
        expected:
          element_not_exists: ".slash-menu"

      # Chat input should contain the slash command
      - action: verify
        expected:
          input_contains:
            selector: ".chat-input__textarea"
            value: "/analyze-data "

  - name: "Slash menu refreshes after creating a skill"
    tags: [ui, skills, slash, create]
    steps:
      # Create a custom skill first
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__create-btn"

      - action: type
        selector: ".create-skill-dialog__input:nth-of-type(1)"
        value: "slash-test"

      - action: type
        selector: ".create-skill-dialog__input:nth-of-type(2)"
        value: "Skill for testing slash menu refresh"

      - action: type
        selector: ".create-skill-dialog__textarea"
        value: "Say hi."

      - action: click
        selector: ".create-skill-dialog__save"

      - action: verify
        expected:
          element_not_exists: ".create-skill-overlay"

      # Now type / and verify the new skill appears
      - action: type
        selector: ".chat-input__textarea"
        value: "/slash-test"

      - action: verify
        expected:
          element_exists: ".slash-menu"

      - action: verify
        expected:
          text_contains: "slash-test"

      # Clean up: delete the test skill
      - action: clear
        selector: ".chat-input__textarea"

      - action: click
        selector: ".skills-panel__item:last-child .skills-panel__delete-btn"

      - action: confirm_dialog
        accept: true

  # ── Use Skill ──────────────────────────────────────────────────

  - name: "Use skill button populates chat input"
    tags: [ui, skills, use]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      # Click the Use button on the first skill card
      - action: click
        selector: ".skills-panel__item .skills-panel__use-btn"

      - action: verify
        expected:
          input_contains:
            selector: ".chat-input__textarea"
            value: "/analyze-data"

      - action: verify
        expected:
          element_not_exists: ".skill-detail-overlay"

  - name: "Use skill from detail modal closes modal"
    tags: [ui, skills, use, modal]
    steps:
      - action: click
        selector: ".sidebar__tab:nth-child(2)"

      - action: click
        selector: ".skills-panel__item"

      - action: verify
        expected:
          element_exists: ".skill-detail-overlay"

      # Click Use inside the modal
      - action: click
        selector: ".skill-detail-modal .skills-panel__use-btn"

      - action: verify
        expected:
          element_not_exists: ".skill-detail-overlay"

      - action: verify
        expected:
          input_contains:
            selector: ".chat-input__textarea"
            value: "/analyze-data"

  # ── Invoke Skill via Agent ─────────────────────────────────────

  - name: "Invoke default skill via chat"
    tags: [data, skills, agent]
    steps:
      - action: upload_file
        file: ./test-data/sales.csv

      - action: send_message
        input: "use this skill /analyze-data"

      - action: wait_for_response
        timeout: 120000

      - action: verify
        expected:
          not_contains: ["error"]

      - action: verify_llm
        criteria: "The response should demonstrate that the agent used the analyze-data skill to examine the uploaded dataset, providing some kind of data analysis or summary"
        pass_threshold: 0.7

  - name: "Invoke multiple skills in one message"
    tags: [data, skills, agent]
    steps:
      - action: upload_file
        file: ./test-data/sales.csv

      - action: send_message
        input: "use this skill /analyze-data use this skill /analyze-data What are the top 3 products by revenue?"

      - action: wait_for_response
        timeout: 120000

      - action: verify
        expected:
          not_contains: ["error"]

      - action: verify_llm
        criteria: "The response should show the agent analyzed the data and identified top products by revenue, demonstrating that the skill was invoked"
        pass_threshold: 0.7
