backend:
  image:
    repository: duckdb-data-agent-k8s
    tag: latest
    pullPolicy: IfNotPresent
  port: 10000
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  env:
    SANDBOX_RUNTIME: k8s
    CONTAINER_IMAGE: duckdb-agent-sidecar:latest
    # Model configuration (leave empty to use backend defaults)
    ORCHESTRATOR_MODEL: ""
    SQL_SUBAGENT_MODEL: ""
    DEFAULT_TOOL_MODEL: ""

bifrost:
  image:
    repository: maximhq/bifrost
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

sidecar:
  image:
    repository: duckdb-agent-sidecar
    tag: latest

secrets:
  # Provide one or both depending on which provider you use
  anthropicApiKey: ""
  openaiApiKey: ""

ingress:
  enabled: false
  className: nginx
  host: duckdb-agent.local
  tls: []

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
