apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-opensandbox
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensandbox
spec:
  replicas: {{ .Values.opensandbox.replicas }}
  selector:
    matchLabels:
      {{- include "duckdb-data-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opensandbox
  template:
    metadata:
      labels:
        {{- include "duckdb-data-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opensandbox
    spec:
      serviceAccountName: {{ include "duckdb-data-agent.fullname" . }}-opensandbox
      containers:
        - name: opensandbox
          image: "{{ .Values.opensandbox.image.repository }}:{{ .Values.opensandbox.image.tag }}"
          imagePullPolicy: {{ .Values.opensandbox.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.opensandbox.port }}
              protocol: TCP
          volumeMounts:
            - name: opensandbox-config
              mountPath: /app/config.toml
              subPath: opensandbox-config.toml
              readOnly: true
          resources:
            {{- toYaml .Values.opensandbox.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: opensandbox-config
          configMap:
            name: {{ include "duckdb-data-agent.fullname" . }}-config
