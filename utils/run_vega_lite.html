<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vega-Lite JSON Renderer</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { margin-bottom: 16px; font-size: 1.4rem; color: #333; }
    textarea {
      width: 100%;
      height: 200px;
      font-family: monospace;
      font-size: 13px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 8px 20px;
      font-size: 14px;
      background: #4c78a8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #3a5f8a; }
    #error { color: #e74c3c; margin-top: 8px; font-size: 13px; }
    #chart { margin-top: 20px; background: #fff; border-radius: 6px; padding: 16px; }
  </style>
</head>
<body>
  <h1>Vega-Lite JSON Renderer</h1>
  <textarea id="json-input" placeholder='Paste Vega-Lite JSON here, e.g. {"$schema": "https://vega.github.io/schema/vega-lite/v5.json", "mark": "bar", ...}'></textarea>
  <button onclick="renderChart()">Render</button>
  <div id="error"></div>
  <div id="chart"></div>

  <script>
    function renderChart() {
      const errorEl = document.getElementById('error');
      const chartEl = document.getElementById('chart');
      errorEl.textContent = '';
      chartEl.innerHTML = '';

      let spec;
      try {
        spec = JSON.parse(document.getElementById('json-input').value);
      } catch (e) {
        errorEl.textContent = 'Invalid JSON: ' + e.message;
        return;
      }

      vegaEmbed(chartEl, spec, { renderer: 'svg', actions: true }).catch(function (err) {
        errorEl.textContent = 'Render error: ' + err.message;
      });
    }
  </script>
</body>
</html>
