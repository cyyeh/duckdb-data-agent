apiVersion: v1
kind: Service
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-bifrost
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: bifrost
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.bifrost.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "duckdb-data-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bifrost
