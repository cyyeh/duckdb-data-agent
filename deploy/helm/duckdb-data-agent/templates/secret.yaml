apiVersion: v1
kind: Secret
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-secret
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- else }}
  anthropic-api-key: ""
  {{- end }}
