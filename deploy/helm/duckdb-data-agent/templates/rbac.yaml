apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-backend
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-sandbox-manager
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-sandbox-manager
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "duckdb-data-agent.fullname" . }}-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "duckdb-data-agent.fullname" . }}-backend
    namespace: {{ .Release.Namespace }}
