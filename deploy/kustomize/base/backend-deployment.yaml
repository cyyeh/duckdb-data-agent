apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: duckdb-data-agent:latest
          ports:
            - containerPort: 10000
          env:
            - name: OPENSANDBOX_DOMAIN
              value: "opensandbox:8080"
            - name: BIFROST_BASE_URL
              value: "http://bifrost:8080"
            - name: BACKEND_BASE_URL
              value: "http://backend:10000"
            - name: SANDBOX_RUNTIME
              value: "kubernetes"
            - name: CONTAINER_IMAGE
              value: "duckdb-agent-sidecar:latest"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secret
                  key: OPENAI_API_KEY
                  optional: true
            # Override model names via kustomize patches or env
            # - name: ORCHESTRATOR_MODEL
            # - name: SQL_SUBAGENT_MODEL
            # - name: DEFAULT_TOOL_MODEL
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 10000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
