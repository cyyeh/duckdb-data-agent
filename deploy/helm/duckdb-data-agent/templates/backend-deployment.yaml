apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duckdb-data-agent.fullname" . }}-backend
  labels:
    {{- include "duckdb-data-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "duckdb-data-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "duckdb-data-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: BIFROST_BASE_URL
              value: "http://{{ include "duckdb-data-agent.fullname" . }}-bifrost:{{ .Values.bifrost.port }}"
            - name: BACKEND_BASE_URL
              value: "http://{{ include "duckdb-data-agent.fullname" . }}-backend:{{ .Values.backend.port }}"
            - name: SANDBOX_RUNTIME
              value: {{ .Values.backend.env.SANDBOX_RUNTIME | quote }}
            - name: CONTAINER_IMAGE
              value: {{ .Values.backend.env.CONTAINER_IMAGE | quote }}
            {{- if .Values.backend.env.ORCHESTRATOR_MODEL }}
            - name: ORCHESTRATOR_MODEL
              value: {{ .Values.backend.env.ORCHESTRATOR_MODEL | quote }}
            {{- end }}
            {{- if .Values.backend.env.SQL_SUBAGENT_MODEL }}
            - name: SQL_SUBAGENT_MODEL
              value: {{ .Values.backend.env.SQL_SUBAGENT_MODEL | quote }}
            {{- end }}
            {{- if .Values.backend.env.DEFAULT_TOOL_MODEL }}
            - name: DEFAULT_TOOL_MODEL
              value: {{ .Values.backend.env.DEFAULT_TOOL_MODEL | quote }}
            {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "duckdb-data-agent.fullname" . }}-secret
                  key: anthropic-api-key
            {{- if .Values.secrets.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "duckdb-data-agent.fullname" . }}-secret
                  key: openai-api-key
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "duckdb-data-agent.fullname" . }}-data
      {{- end }}
