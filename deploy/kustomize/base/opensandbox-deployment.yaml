apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox
  labels:
    app: opensandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensandbox
  template:
    metadata:
      labels:
        app: opensandbox
    spec:
      serviceAccountName: opensandbox
      containers:
        - name: opensandbox
          image: opensandbox/server:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /root/.sandbox.toml
              subPath: sandbox.toml
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: opensandbox-config
