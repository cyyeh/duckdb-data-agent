<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plotly JSON Renderer</title>
  <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
    h1 { margin-bottom: 16px; font-size: 1.4rem; color: #333; }
    textarea {
      width: 100%;
      height: 200px;
      font-family: monospace;
      font-size: 13px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      padding: 8px 20px;
      font-size: 14px;
      background: #636efa;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #4c5ad9; }
    #error { color: #e74c3c; margin-top: 8px; font-size: 13px; }
    #chart { margin-top: 20px; background: #fff; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Plotly JSON Renderer</h1>
  <textarea id="json-input" placeholder='Paste Plotly JSON here, e.g. {"data": [...], "layout": {...}}'></textarea>
  <button onclick="renderPlot()">Render</button>
  <div id="error"></div>
  <div id="chart"></div>

  <script>
    function renderPlot() {
      const errorEl = document.getElementById('error');
      const chartEl = document.getElementById('chart');
      errorEl.textContent = '';

      let spec;
      try {
        spec = JSON.parse(document.getElementById('json-input').value);
      } catch (e) {
        errorEl.textContent = 'Invalid JSON: ' + e.message;
        return;
      }

      const data = spec.data || [];
      const layout = spec.layout || {};
      // frames can live at spec.frames (standard) or spec.layout.frames (common variant)
      const frames = spec.frames || layout.frames || [];
      delete layout.frames;
      Plotly.newPlot(chartEl, data, layout, { responsive: true }).then(function () {
        if (frames.length) {
          Plotly.addFrames(chartEl, frames);
        }
      });
    }
  </script>
</body>
</html>
